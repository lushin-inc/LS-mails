<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Outreach</title>
<style>
:root{
 --bg:#f4f6f8; --card:#fff; --card2:#fafbfc; --ink:#18202e; --muted:#667085; --line:#e3e7ec;
 --accent:#2F3B52; --accent-ink:#fff; --accent-soft:#eef1f6;
 --gold:#9a7418; --gold-bg:#fdf4de; --gold-line:#ecd9a6;
 --green:#1f7a44; --green-bg:#e6f4ec; --amber:#8a6d00; --amber-bg:#fff3cd;
 --sent:#2563eb; --sentbg:#eaf0fe; --recv:#047857; --recvbg:#e6f5f0;
 --shadow:0 1px 3px rgba(16,24,40,.07),0 8px 24px -12px rgba(16,24,40,.18);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0e1218; --card:#161c25; --card2:#1b222c; --ink:#e6ebf3; --muted:#93a0b4; --line:#27303d;
 --accent:#7f9bc9; --accent-ink:#0e1218; --accent-soft:#1d2635;
 --gold:#e0b657; --gold-bg:#2a2210; --gold-line:#4a3c17;
 --green:#5fce94; --green-bg:#122a1e; --amber:#e3bc55; --amber-bg:#2a2410;
 --sent:#7aa6f8; --sentbg:#151f33; --recv:#54c6a2; --recvbg:#0f2620;
 --shadow:0 1px 3px rgba(0,0,0,.5),0 8px 24px -12px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
 --bg:#0e1218; --card:#161c25; --card2:#1b222c; --ink:#e6ebf3; --muted:#93a0b4; --line:#27303d;
 --accent:#7f9bc9; --accent-ink:#0e1218; --accent-soft:#1d2635;
 --gold:#e0b657; --gold-bg:#2a2210; --gold-line:#4a3c17;
 --green:#5fce94; --green-bg:#122a1e; --amber:#e3bc55; --amber-bg:#2a2410;
 --sent:#7aa6f8; --sentbg:#151f33; --recv:#54c6a2; --recvbg:#0f2620;
 --shadow:0 1px 3px rgba(0,0,0,.5),0 8px 24px -12px rgba(0,0,0,.7);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);line-height:1.5;
 font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
 -webkit-text-size-adjust:100%}
a{color:inherit}
.wrap{max-width:780px;margin:0 auto}
.top{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line);
 padding:calc(env(safe-area-inset-top) + 10px) 16px 10px}
.toprow{display:flex;align-items:center;gap:10px;max-width:780px;margin:0 auto}
h1{font-size:17px;font-weight:600;margin:0;color:var(--muted);letter-spacing:.01em;flex:1}
.iconbtn.hide{display:none}
.iconbtn{width:40px;height:40px;flex:0 0 40px;border-radius:11px;border:1px solid var(--line);
 background:var(--card2);color:var(--ink);font-size:17px;display:flex;align-items:center;
 justify-content:center;cursor:pointer;padding:0}
.iconbtn:active{transform:scale(.94)}
.search{width:100%;padding:12px 14px;font-size:16px;border:1px solid var(--line);border-radius:12px;
 background:var(--card2);color:var(--ink);outline:none;margin-top:10px}
.search:focus{border-color:var(--accent)}
#filters.collapsed .frow{display:none}
#filters.collapsed .fbar{margin-bottom:2px}
.fbar{display:flex;gap:8px;align-items:center;margin-top:9px}
.fbar .fbtn{padding:9px 15px}
.fbadge{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;
 border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:800;margin-left:7px;padding:0 5px}
.frow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:9px;max-width:780px}
.flabel{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;
 letter-spacing:.07em;width:100%;margin:5px 0 1px}
.fbtn{border:1px solid var(--line);background:var(--card2);color:var(--muted);border-radius:999px;
 padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;line-height:1.2}
.fbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.count{font-size:12.5px;color:var(--muted);padding:12px 16px 4px;max-width:780px;margin:0 auto}
.list{padding:0 12px 40px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
 border-radius:14px;padding:13px 14px;margin-bottom:8px;min-height:68px;cursor:pointer;
 box-shadow:var(--shadow)}
.row:active{transform:scale(.995)}
.row.done{opacity:.5}
.rmain{flex:1;min-width:0}
.rname{font-size:16px;font-weight:650;letter-spacing:-.01em}
.rco{font-size:13.5px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rtags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:6px;letter-spacing:.02em;
 background:var(--accent-soft);color:var(--accent)}
.chip.intent{background:var(--gold-bg);color:var(--gold);border:1px solid var(--gold-line)}
.chip.hiring{background:var(--green-bg);color:var(--green)}
.chip.fit{background:var(--amber-bg);color:var(--amber)}
.rtz{font-size:11px;font-weight:700;color:var(--muted);flex:0 0 auto;align-self:flex-start;padding-top:3px}
.empty{text-align:center;color:var(--muted);padding:56px 20px;font-size:14.5px}
/* detail */
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--accent);
 font-size:15px;font-weight:600;cursor:pointer;padding:0}
.dwrap{padding:16px 16px 60px}
.dname{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:4px 0 2px}
.dmeta{font-size:14.5px;color:var(--muted)}
.dmeta div{margin-top:1px}
.calls{display:flex;gap:10px;margin:18px 0 0}
.call{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
 min-height:74px;border-radius:16px;text-decoration:none;font-weight:700;font-size:17px;
 background:linear-gradient(160deg,#33415c,#212b3f);color:#fff;
 box-shadow:0 10px 24px -14px rgba(33,43,63,.9)}
.call small{font-size:11px;font-weight:700;opacity:.72;text-transform:uppercase;letter-spacing:.08em}
.call.sec{background:linear-gradient(160deg,#4a5a78,#35415a)}
.call:active{transform:scale(.98)}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.lnk{display:inline-flex;align-items:center;gap:7px;text-decoration:none;border:1px solid var(--line);
 background:var(--card);color:var(--ink);border-radius:12px;padding:11px 14px;font-size:14px;
 font-weight:600;min-height:46px}
.lnk:active{background:var(--accent-soft)}
.lnk svg{width:16px;height:16px;flex:0 0 16px;stroke:var(--muted);fill:none;stroke-width:1.9;
 stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-top:14px;
 box-shadow:var(--shadow);overflow:hidden}
.card>h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
 margin:0;padding:14px 16px 0;font-weight:700}
.card .body{padding:12px 16px 16px}
.card.gold{background:var(--gold-bg);border-color:var(--gold-line)}
.card.gold>h2{color:var(--gold)}
details.card>summary{list-style:none;cursor:pointer;padding:15px 16px;font-size:12px;
 text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;
 display:flex;align-items:center;gap:8px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"›";margin-left:auto;font-size:19px;transform:rotate(90deg);
 transition:transform .15s;color:var(--muted)}
details.card[open]>summary::after{transform:rotate(-90deg)}
ul.bul{margin:0;padding:0;list-style:none}
ul.bul li{padding:9px 0;border-top:1px solid var(--line);font-size:14.5px}
ul.bul li:first-child{border-top:0;padding-top:2px}
ul.bul b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;
 color:var(--muted);font-weight:700;margin-bottom:3px}
ul.pts{margin:0;padding:0;list-style:none}
ul.pts li{position:relative;padding:3px 0 3px 16px;border:0;font-size:14.5px}
ul.pts li::before{content:"";position:absolute;left:3px;top:12px;width:5px;height:5px;border-radius:50%;background:var(--muted);opacity:.6}
.itopic{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:14.5px;font-weight:600}
.iscore{margin-left:auto;font-size:12px;font-weight:700;color:var(--gold);
 border:1px solid var(--gold-line);border-radius:6px;padding:2px 7px}
.script{font-size:16px;line-height:1.62}
.script p{margin:0 0 13px}
.script .beat{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
 color:var(--muted);margin:18px 0 7px}
.script strong{font-weight:750}
.script .slot{background:var(--gold-bg);color:var(--gold);border-bottom:2px solid var(--gold-line);
 padding:1px 4px;border-radius:4px;font-weight:650}
.script .todo{background:var(--gold-bg);color:var(--gold);border:1px dashed var(--gold-line);
 padding:2px 7px;border-radius:6px;font-weight:700;font-size:14px}
.pause{color:var(--muted);font-style:italic}
.msg{border-top:1px solid var(--line);padding:11px 0}
.msg:first-child{border-top:0}
.mh{display:flex;gap:8px;align-items:baseline;font-size:11.5px;color:var(--muted);margin-bottom:3px}
.dir{font-weight:700;font-size:10px;padding:2px 6px;border-radius:5px;letter-spacing:.04em}
.dir.s{background:var(--sentbg);color:var(--sent)}
.dir.r{background:var(--recvbg);color:var(--recv)}
.msubj{font-size:14px;font-weight:650;margin-bottom:3px}
.mbody{font-size:13.5px;color:var(--muted);white-space:pre-wrap;word-break:break-word}
.donebar{display:flex;gap:10px;margin-top:16px}
.donebtn{flex:1;min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--card);
 color:var(--ink);font-size:15px;font-weight:700;cursor:pointer}
.donebtn[aria-pressed="true"]{background:var(--green-bg);border-color:var(--green);color:var(--green)}
@media(min-width:620px){.dname{font-size:30px}}
</style></head><body>

function firstPoint(s){
  s=String(s).replace(/^Notes:\s*/i,"").trim();
  const m=s.match(/1\)\s*([\s\S]*?)(?=\s*\d\)|$)/);   // numbered discovery points
  return (m?m[1]:s).trim();
}
function hookPhrase(c){
  const d=c.disc||[];
  for(const lab of PRIORITY){const f=d.find(x=>x[0]===lab);
    if(f)return{txt:trimClause(firstPoint(f[1])),frame:"priority"};}
  if(c.focus)return{txt:trimClause(firstPoint(c.focus)),frame:"priority"};
  for(const lab of CONTEXT){const f=d.find(x=>x[0]===lab);
    if(f)return{txt:trimClause(firstPoint(f[1])),frame:"context"};}
  return null;
}
function points(v){
  const s=String(v).trim();
  const parts=s.split(/\s*\d\)\s*/).map(x=>x.trim()).filter(Boolean);
  if(parts.length<2)return esc(s);
  return '<ul class="pts">'+parts.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul>';
}
function trimClause(s){
  s=String(s).trim().replace(/\s+/g," ");
  if(s.length>150){s=s.slice(0,150);const p=s.lastIndexOf(" ");if(p>60)s=s.slice(0,p);s+="…";}
  return s.replace(/[.\s]+$/,"");
}

/* ---------- filters ---------- */
function chips(){
  const mk=(label,items,key)=>`<div class="flabel">${label}</div>`+items.map(t=>{
    const v=Array.isArray(t)?t[0]:t, lab=Array.isArray(t)?t[1]:t;
    return `<button class="fbtn" data-k="${key}" data-v="${esc(v)}" aria-pressed="${F[key].has(v)}">${esc(lab)}</button>`}).join("");
  const active=F.stage.size+F.sig.size+F.tz.size+(F.hide?1:0);
  const el=document.getElementById("filters");
  el.className="wrap"+(F.open?"":" collapsed");
  el.innerHTML=
    `<input class="search" id="q" type="search" placeholder="Search name, company, title" value="${esc(F.q)}">`+
    `<div class="fbar"><button class="fbtn" id="ftoggle" aria-pressed="${F.open}">Filters${active?`<span class="fbadge">${active}</span>`:""}</button>`+
    (active?`<button class="fbtn" id="fclear">Clear</button>`:"")+`</div>`+
    `<div class="frow">${mk("Stage",STAGES,"stage")}</div>`+
    `<div class="frow">${mk("Signal",SIGNALS,"sig")}</div>`+
    `<div class="frow">${mk("Time zone",TZS,"tz")}</div>`+
    `<div class="frow"><div class="flabel">Progress</div>`+
    `<button class="fbtn" data-k="hide" aria-pressed="${F.hide}">Hide called</button></div>`;
  document.getElementById("ftoggle").onclick=()=>{F.open=!F.open;chips()};
  const fc=document.getElementById("fclear");
  if(fc)fc.onclick=()=>{F.stage.clear();F.sig.clear();F.tz.clear();F.hide=false;chips();renderList(true)};
  document.getElementById("q").oninput=e=>{F.q=e.target.value;renderList(true)};
  document.querySelectorAll('#filters .fbtn[data-k]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k;
    if(k==="hide"){F.hide=!F.hide}
    else{const v=b.dataset.v;F[k].has(v)?F[k].delete(v):F[k].add(v)}
    chips();renderList(true);});
}
function match(c){
  if(F.hide&&done[c.n+"|"+c.c])return false;
  if(F.stage.size&&![...F.stage].some(t=>c.tg.includes(t)))return false;
  if(F.sig.size&&![...F.sig].some(t=>c.tg.includes(t)))return false;
  if(F.tz.size){const t=c.tz||"Unknown";if(!F.tz.has(t))return false;}
  if(F.q){const q=F.q.toLowerCase();
    if(!((c.n+" "+c.c+" "+c.t).toLowerCase().includes(q)))return false;}
  return true;
}
/* ---------- list ---------- */
function renderList(keep){
  document.getElementById("navbtn").classList.add("hide");
  document.getElementById("title").textContent="Outreach";
  document.getElementById("filters").style.display="";
  const rows=DATA.map((c,i)=>[c,i]).filter(([c])=>match(c));
  document.getElementById("count").textContent=
    rows.length+" of "+DATA.length+" contacts"+(Object.keys(done).length?" · "+Object.keys(done).length+" called":"");
  document.getElementById("view").innerHTML='<div class="list">'+(rows.length?rows.map(([c,i])=>{
    const tg=c.tg.filter(t=>STAGES.includes(t));
    const sig=c.tg.filter(t=>SIGNALS.includes(t));
    return `<div class="row ${done[c.n+"|"+c.c]?"done":""}" data-i="${i}">
      <div class="rmain">
        <div class="rname">${esc(c.n)}</div>
        <div class="rco">${esc(c.c)}${c.t?" · "+esc(c.t):""}</div>
        <div class="rtags">${tg.map(t=>`<span class="chip">${esc(t)}</span>`).join("")}
          ${sig.map(t=>`<span class="chip ${t==="Intent"?"intent":t==="HiringSales"?"hiring":""}">${esc(t)}</span>`).join("")}
          ${c.fit?`<span class="chip fit">${esc(c.fit)}</span>`:""}</div>
      </div>
      <div class="rtz">${esc(c.tz==="Unknown"?"":(c.tz||""))}</div></div>`}).join("")
    :'<div class="empty">No contacts match these filters.</div>')+'</div>';
  document.querySelectorAll(".row").forEach(r=>r.onclick=()=>{location.hash="#c"+r.dataset.i});
  if(!keep)scrollTo(0,0);
}
/* ---------- detail ---------- */
const ICON={site:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18"/></svg>',
 li:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M7 10v7M7 7v.01M11 17v-4a2 2 0 0 1 4 0v4"/></svg>',
 zi:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',
 mail:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>'};

function scriptHTML(c){
  const first=String(c.n||"").split(" ")[0];
  const y=yr(c); const hook=hookPhrase(c);
  const isClient=c.tg.includes("Client");
  const hookLine = hook
    ? (hook.frame==="priority"
        ? `your name kept coming to mind because … I remember that <span class="slot">${esc(hook.txt)}</span> was a big priority for you….`
        : `your name kept coming to mind because … I remember you were focused on <span class="slot">${esc(hook.txt)}</span>….`)
    : `your name kept coming to mind because … I remember that <span class="todo">what mattered to them</span> was a big priority for you….`;
  const bought=isClient
    ? `and… you liked something about the way <strong>I</strong> approached SELLING because you bought from ME…`
    : `and… you liked something about the way <strong>I</strong> approached SELLING…`;
  return `<div class="script">
   <div class="beat">Open</div>
   <p>Hey ${esc(first)}, this is Dan Faber, I was with LinkedSelling last time we spoke, back in ${y?`<span class="slot">${y}</span>`:`<span class="todo">year</span>`}.</p>
   <p>Do you remember me?</p>
   <p class="pause">(Pause)</p>
   <div class="beat">Hook</div>
   <p>I've since stepped out and have my own clients now and</p>
   <p>${hookLine} ${bought}</p>
   <p>So I guess... is that still a focus for you guys?</p>
   <div class="beat">Do?</div>
   <p>I'm coming at it from the Sales Effectiveness end of things now.</p>
   <p>With Lushin - Work with Founders / Entrepreneurs who are FRUSTRATED... with the growth of their business</p>
   <p>and typically the frustration... comes either from</p>
   <p>not enough NEW business to reach the company's goals...</p>
   <p>or deals stuck in the pipeline that nobody seems to know how to move forward...</p>
   <div class="beat">Next</div>
   <p>I've put together this 20 minute talk summarizing a lot of the concepts I followed in the sales process I took you through... if you're up for it.... (since I interrupted your day)... I can schedule a separate time to show you behind the curtains on that... if there's a reason for us to work together, great. But if not, I'll record that and send it over and send you on your way.</p>
  </div>`;
}
function renderDetail(i){
  const c=DATA[i];if(!c)return location.hash="";
  document.getElementById("navbtn").classList.remove("hide");
  document.getElementById("title").textContent="";
  document.getElementById("filters").style.display="none";
  document.getElementById("count").textContent="";
  const key=c.n+"|"+c.c;
  const L=[];
  if(c.site)L.push(`<a class="lnk" href="${esc(c.site)}" target="_blank" rel="noopener">${ICON.site}${esc(host(c.site))}</a>`);
  if(c.li)L.push(`<a class="lnk" href="${esc(c.li)}" target="_blank" rel="noopener">${ICON.li}LinkedIn</a>`);
  if(c.lico)L.push(`<a class="lnk" href="${esc(c.lico)}" target="_blank" rel="noopener">${ICON.li}Company page</a>`);
  if(c.zi)L.push(`<a class="lnk" href="${esc(c.zi)}" target="_blank" rel="noopener">${ICON.zi}ZoomInfo</a>`);
  if(c.zico)L.push(`<a class="lnk" href="${esc(c.zico)}" target="_blank" rel="noopener">${ICON.zi}ZoomInfo company</a>`);
  if(c.e)L.push(`<a class="lnk" href="mailto:${esc(c.e)}">${ICON.mail}Email</a>`);

  const disc=(c.disc||[]).slice();
  if(c.focus&&!disc.length)disc.push(["Notes",String(c.focus).replace(/^Notes:\s*/,"")]);
  const tgAll=c.tg.filter(t=>STAGES.includes(t)),sigAll=c.tg.filter(t=>SIGNALS.includes(t));

  document.getElementById("view").innerHTML=`<div class="dwrap">
   <div class="dname">${esc(c.n)}</div>
   <div class="dmeta">
     ${c.t?`<div>${esc(c.t)}</div>`:""}
     <div>${esc(c.c)}</div>
     ${(c.city||c.st)?`<div>${esc([c.city,c.st].filter(Boolean).join(", "))}${c.tz&&c.tz!=="Unknown"?" · "+esc(c.tz):""}</div>`:""}
     ${c.ind?`<div>${esc(c.ind)}</div>`:""}
   </div>
   <div class="rtags" style="margin-top:10px">
     ${tgAll.map(t=>`<span class="chip">${esc(t)}</span>`).join("")}
     ${sigAll.map(t=>`<span class="chip ${t==="Intent"?"intent":t==="HiringSales"?"hiring":""}">${esc(t)}</span>`).join("")}
     ${c.fit?`<span class="chip fit">${esc(c.fit)}</span>`:""}
     ${c.emp?`<span class="chip">${esc(c.emp.replace("Employees.","").replace("to","–"))} staff</span>`:""}
   </div>
   ${(c.m||c.dp)?`<div class="calls">
     ${c.m?`<a class="call" href="tel:${tel(c.m)}"><small>Cell</small>${esc(c.m)}</a>`:""}
     ${c.dp?`<a class="call sec" href="tel:${tel(c.dp)}"><small>Direct</small>${esc(c.dp)}</a>`:""}
   </div>`:`<div class="card"><div class="body" style="color:var(--muted);font-size:14px">No phone number on file.</div></div>`}
   ${L.length?`<div class="links">${L.join("")}</div>`:""}
   ${c.intent&&c.intent.length?`<div class="card gold"><h2>Intent — researching this now</h2><div class="body">
     ${c.intent.map(x=>`<div class="itopic">${esc(x.t)}${x.s?`<span class="iscore">${x.s}</span>`:""}</div>`).join("")}
   </div></div>`:""}
   ${disc.length?`<div class="card"><h2>At a glance</h2><div class="body"><ul class="bul">
     ${disc.map(x=>`<li><b>${esc(x[0])}</b>${points(x[1])}</li>`).join("")}
   </ul></div></div>`:""}
   <div class="card"><h2>Reactivation call</h2><div class="body">${scriptHTML(c)}</div></div>
   ${c.em&&c.em.length?`<details class="card"><summary>Email history — ${c.em.length} message${c.em.length>1?"s":""}</summary>
     <div class="body">${c.em.map(m=>`<div class="msg">
       <div class="mh"><span class="dir ${m.dir==="sent"?"s":"r"}">${m.dir==="sent"?"SENT":"RECEIVED"}</span><span>${esc(m.d)}</span></div>
       <div class="msubj">${esc(m.subj)}</div>
       <div class="mbody">${esc(m.body)}</div></div>`).join("")}</div></details>`
   :`<div class="card"><div class="body" style="color:var(--muted);font-size:14px">
      ${c.sent||c.rec?`${c.sent} sent · ${c.rec} received${c.first?" · first "+esc(c.first):""}${c.last?" · last "+esc(c.last):""}`:"No email history."}
     </div></div>`}
   <div class="donebar">
     <button class="donebtn" id="dbtn" aria-pressed="${!!done[key]}">${done[key]?"✓ Called":"Mark called"}</button>
   </div>
  </div>`;
  document.getElementById("dbtn").onclick=e=>{
    if(done[key])delete done[key];else done[key]=1;
    LS.set("outreach.done",done);
    e.target.setAttribute("aria-pressed",!!done[key]);
    e.target.textContent=done[key]?"✓ Called":"Mark called";};
  scrollTo(0,0);
}
document.getElementById("navbtn").onclick=()=>{location.hash=""};
function route(){
  const h=location.hash;
  if(h.startsWith("#c"))renderDetail(+h.slice(2));
  else{chips();renderList(false)}
}
addEventListener("hashchange",route);
chips();route();
</script></body></html>
